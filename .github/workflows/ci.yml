name: CI

on:
  workflow_call:
    inputs:
      build-electron-frontend:
        description: 'Export the frontend for the Electron release builds'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Run Backend CI
        run: |
          chmod +x ci.sh
          ./ci.sh backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend CI
        run: |
          chmod +x ci.sh
          ./ci.sh frontend

      # Both Electron builds use the same static export. Docker builds its own with /api.
      - name: Build frontend for Electron
        if: inputs.build-electron-frontend
        run: npm run build
        working-directory: frontend

      - name: Upload Electron frontend export
        if: inputs.build-electron-frontend
        uses: actions/upload-artifact@v7
        with:
          name: electron-frontend
          path: frontend/out/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
