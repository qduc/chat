name: Electron Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          # - os: macos-latest
          #   platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Download Electron frontend export
        uses: actions/download-artifact@v8
        with:
          name: electron-frontend
          path: frontend/out

      # Prepare electron build
      - name: Copy backend to electron
        shell: bash
        run: |
          mkdir -p electron/backend
          cp -r backend/* electron/backend/
          rm -rf electron/backend/node_modules electron/backend/__tests__ electron/backend/coverage electron/backend/logs electron/backend/data
          find electron/backend -name "*.test.js" -delete
          find electron/backend -name ".env*" -delete

      - name: Copy frontend build to electron
        shell: bash
        run: |
          mkdir -p electron/frontend
          cp -r frontend/out electron/frontend/out

      - name: Set app version from tag
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          node scripts/sync-version.js "${GITHUB_TAG:?Release tag is required}"
      # Install electron dependencies and build
      - name: Install electron dependencies
        # electron-builder downloads Electron and rebuilds native dependencies for its ABI.
        run: npm ci --ignore-scripts --prefer-offline --no-audit
        working-directory: electron

      - name: Cache Electron SQLite binary
        id: sqlite-cache
        uses: actions/cache@v5
        with:
          # Restore after npm ci, which clears node_modules. The rebuild marker
          # is tied to Electron's ABI; the lockfile pins both Electron and SQLite.
          path: |
            electron/node_modules/better-sqlite3/build/Release/better_sqlite3.node
            electron/node_modules/better-sqlite3/build/Release/.forge-meta
          key: electron-sqlite-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install compiler for Linux SQLite rebuild
        if: matrix.platform == 'linux' && steps.sqlite-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19
          echo 'CC=clang-19' >> "$GITHUB_ENV"
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"

      - name: Build Windows installers with faster compression
        if: matrix.platform == 'win'
        run: npm run dist
        working-directory: electron
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux installers
        if: matrix.platform == 'linux'
        run: npm run dist -- -c.deb.compression=zst
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload artifacts
      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/dist/*.tar.gz
          if-no-files-found: warn

      # - name: Upload macOS artifacts
      #   if: matrix.platform == 'mac'
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: mac-artifacts
      #     path: |
      #       electron/dist/*.dmg
      #       electron/dist/*.zip
      #     if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: win-artifacts
          path: |
            electron/dist/*.exe
            electron/dist/*.msi
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          TAG=""
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Electron installers
        uses: actions/download-artifact@v8
        with:
          pattern: '*-artifacts'
          path: artifacts

      - name: Display downloaded files
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*" | head -50

      - name: Extract changelog for release
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          # Remove 'v' prefix if present
          VERSION_NUM="${VERSION#v}"

          # Extract changelog section for this version
          # Using awk to extract content between version headers
          CHANGELOG=$(awk -v version="$VERSION_NUM" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" version "\\]") {
                found=1
                next
              }
            }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            echo "No changelog entry found for version $VERSION_NUM"
            CHANGELOG="Release $VERSION"
          fi

          # Save to file to preserve formatting
          echo "$CHANGELOG" > /tmp/changelog.txt

          # Also output for debugging
          echo "Extracted changelog:"
          cat /tmp/changelog.txt

      - name: Create GitHub Release
        if: steps.resolve_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.resolve_tag.outputs.tag, '-') }}
          body_path: /tmp/changelog.txt
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
